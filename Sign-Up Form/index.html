<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="image-container">
        <img
          src="./src/halie-west-25xggax4bSA-unsplash.jpg"
          alt=""
          class="card-image"
        />

        <div class="logo-container">
          <div>
            <img
              src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
              alt="odin-project-logo"
              class="logo"
            />
            <span>ODIN</span>
          </div>
        </div>

        <span class="credits"
          >Foto de
          <a
            href="https://unsplash.com/es/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Halie West</a
          >
          en
          <a
            href="https://unsplash.com/es/fotos/planta-de-hoja-verde-en-fotografia-de-primer-plano-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </span>
      </div>

      <div class="content">
        <span class="text"
          >This is not a real service! You know you need something like this in
          your life to help you realize your deepest dreams. Sign Up
          <i>now</i> to get started.</span
        >

        <span class="text">You <i>know</i> you want to.</span>

        <form action="#" method="GET">
          <div class="form-container">
            <span class="text">Let's do this!</span>
            <fieldset class="info">
              <div>
                <label for="surname">FIRST NAME</label>
                <input
                  type="text"
                  placeholder="John"
                  name="surname"
                  id="surname"
                  required
                />
              </div>

              <div>
                <label for="lastname">LAST NAME</label>
                <input
                  type="text"
                  name="lastname"
                  id="lastname"
                  placeholder="Doe"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="info">
              <div>
                <label for="mail">EMAIL</label>
                <input
                  type="email"
                  name="mail"
                  id="mail"
                  placeholder="name@dominio.com"
                  required
                />
              </div>
              <div>
                <label for="phone_number">PHONE NUMBER</label>
                <input
                  type="text"
                  name="phone"
                  id="phone"
                  placeholder="+1 12345678"
                  minlength="8"
                  pattern="(\+\d{1,3} \d{8})"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="info">
              <div>
                <label for="password">PASSWORD</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  minlength="8"
                  placeholder="Password"
                  required
                />
              </div>

              <div>
                <label for="confirm">CONFIRM PASSWORD</label>
                <input
                  type="password"
                  name="confirm"
                  id="confirm"
                  minlength="8"
                  placeholder="Password"
                  required
                />
              </div>
            </fieldset>
          </div>
          <div class="buttons">
            <button type="submit" class="submit">Create Account</button>
            <div class="log-in">
              <span>Already have an account? </span> <button>Log In</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
